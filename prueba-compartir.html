<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Prueba de compartir · Magilu Finance</title>
<meta name="robots" content="noindex">
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' 'unsafe-inline' https://cdn.jsdelivr.net; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; base-uri 'self'; form-action 'self';">
<style>
  body { background:#050912; color:#e2ebf2; font-family:-apple-system, system-ui, sans-serif; margin:0; padding:calc(16px + env(safe-area-inset-top)) 16px 32px; line-height:1.45; }
  h1 { font-size:20px; margin:0 0 6px; }
  p { color:#8a9bb2; font-size:14px; margin:0 0 16px; }
  button { display:block; width:100%; margin:0 0 12px; padding:16px; font-size:17px; font-weight:600; border-radius:10px; border:1px solid #4ab9a0; background:#11192e; color:#e2ebf2; text-align:left; }
  button small { display:block; font-weight:400; font-size:12.5px; color:#8a9bb2; margin-top:3px; }
  .msg { color:#e8b85a; font-size:13px; }
</style>
</head>
<body>
<h1>Prueba: saltos de línea en Gmail</h1>
<p>Pulsa cada botón, elige <strong>Gmail</strong> y mira el borrador (no hace falta enviarlo). Dime qué número se ve con los párrafos separados. Lleva un PDF de prueba adjunto, como el de verdad.</p>

<button type="button" data-v="1">1 · Saltos de línea de Windows<small>\r\n</small></button>
<button type="button" data-v="2">2 · Separadores de párrafo Unicode<small>U+2029 / U+2028</small></button>
<button type="button" data-v="3">3 · Saltos HTML<small>&lt;br&gt;</small></button>

<p class="msg" id="msg"></p>

<script src="https://cdn.jsdelivr.net/npm/jspdf@2.5.1/dist/jspdf.umd.min.js" referrerpolicy="no-referrer"></script>
<script>
'use strict';
// Mismo texto que el correo real del depósito, escrito de tres formas
const LINEAS = [
  'Estimado cliente,', '',
  'En este correo adjuntamos la copia del depósito correspondiente a la nueva cantidad de productos Magilu que dejamos en tienda.', '',
  'Muchas gracias.', 'Un saludo.', 'El equipo de Santofímia Group.'
];
function texto(v){
  if (v === '1') return LINEAS.join('\r\n');
  if (v === '2'){
    // párrafos con U+2029; líneas dentro de un párrafo con U+2028
    return 'Estimado cliente, En este correo adjuntamos la copia del depósito correspondiente a la nueva cantidad de productos Magilu que dejamos en tienda. Muchas gracias. Un saludo. El equipo de Santofímia Group.';
  }
  return LINEAS.join('<br>');
}
function pdfPrueba(){
  const doc = new window.jspdf.jsPDF();
  doc.text('PDF de prueba (no es un depósito real)', 20, 30);
  return new File([doc.output('blob')], 'prueba.pdf', { type:'application/pdf' });
}
document.querySelectorAll('button[data-v]').forEach(b=>{
  b.addEventListener('click', async ()=>{
    const msg = document.getElementById('msg');
    msg.textContent = '';
    try {
      const files = [pdfPrueba()];
      if (!(navigator.canShare && navigator.share && navigator.canShare({ files }))){ msg.textContent = 'Este navegador no puede compartir archivos. Ábrelo en el iPhone.'; return; }
      await navigator.share({ files, text: texto(b.dataset.v) });
    } catch(e){ if (!e || e.name !== 'AbortError') msg.textContent = 'Error: ' + ((e && e.message) || e); }
  });
});
</script>
</body>
</html>
